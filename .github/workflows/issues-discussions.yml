name: Issue & Discussion Notifications to Discord

# Reusable workflow — called from consumer repos (e.g. mailroom-issues).
# github.* context is the caller's event payload (see GitHub reusable workflow docs).
# Secret: DISCORD_WEBHOOK_URL on the caller repo (passed via secrets: inherit).
# Back-compat: also accepts DISCORD_ISSUE_WEBHOOK if DISCORD_WEBHOOK_URL is unset.

on:
  workflow_call:

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Post Discord embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ISSUE_WEBHOOK: ${{ secrets.DISCORD_ISSUE_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          DISCUSSION_CATEGORY: ${{ github.event.discussion.category.name }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 <<'PY'
          import json, os, urllib.error, urllib.request

          webhook = (os.environ.get("DISCORD_WEBHOOK_URL") or "").strip() or (
              os.environ.get("DISCORD_ISSUE_WEBHOOK") or ""
          ).strip()
          if not webhook:
              raise SystemExit("Missing secret DISCORD_WEBHOOK_URL (or DISCORD_ISSUE_WEBHOOK)")

          event = os.environ.get("EVENT_NAME") or ""
          action = os.environ.get("ACTION") or ""
          actor = os.environ.get("ACTOR") or ""

          if event == "issues":
              title = os.environ.get("ISSUE_TITLE") or ""
              body = os.environ.get("ISSUE_BODY") or ""
              url = os.environ.get("ISSUE_URL") or ""
              event_type = "issue"
          elif event == "issue_comment":
              title = os.environ.get("ISSUE_TITLE") or ""
              body = os.environ.get("COMMENT_BODY") or ""
              url = os.environ.get("COMMENT_URL") or os.environ.get("ISSUE_URL") or ""
              event_type = "issue_comment"
          elif event == "discussion":
              title = os.environ.get("DISCUSSION_TITLE") or ""
              body = os.environ.get("DISCUSSION_BODY") or ""
              url = os.environ.get("DISCUSSION_URL") or ""
              event_type = "discussion"
          elif event == "discussion_comment":
              title = os.environ.get("DISCUSSION_TITLE") or ""
              body = os.environ.get("COMMENT_BODY") or ""
              url = os.environ.get("COMMENT_URL") or os.environ.get("DISCUSSION_URL") or ""
              event_type = "discussion_comment"
          else:
              title, body, url, event_type = event, "", "", event

          titles = {
              ("issue", "opened"): "🆕 New Issue",
              ("issue", "closed"): "✅ Closed Issue",
              ("issue", "reopened"): "🔄 Reopened Issue",
              ("issue_comment", "created"): "💬 New Issue Comment",
              ("issue_comment", "edited"): "✏️ Edited Issue Comment",
              ("discussion", "created"): "💬 New Discussion",
              ("discussion", "answered"): "✅ Discussion Answered",
              ("discussion", "unanswered"): "❓ Discussion Unanswered",
              ("discussion", "edited"): "✏️ Updated Discussion",
              ("discussion", "locked"): "🔒 Locked Discussion",
              ("discussion", "unlocked"): "🔓 Unlocked Discussion",
              ("discussion", "pinned"): "📌 Pinned Discussion",
              ("discussion", "unpinned"): "📌 Unpinned Discussion",
              ("discussion", "transferred"): "➡️ Transferred Discussion",
              ("discussion", "category_changed"): "🏷️ Category Changed Discussion",
              ("discussion_comment", "created"): "💬 New Discussion Comment",
              ("discussion_comment", "edited"): "✏️ Edited Discussion Comment",
          }
          embed_title = titles.get((event_type, action), "🔔 Notification")

          body = (body or "No additional details.").strip()
          if len(body) > 1500:
              body = body[:1500] + "…"

          category = os.environ.get("DISCUSSION_CATEGORY") or ""
          desc = (
              f"**{title}**\n\n{body}\n\n"
              f"👤 By: {actor}\n🔗 [View on GitHub]({url})"
          )
          if category:
              desc += f"\n🏷️ Category: {category}"

          # Discord requires integer color (not a hex string)
          colors = {
              ("issue", "opened"): 0x23AF92,
              ("issue", "closed"): 0x2ECC71,
              ("issue", "reopened"): 0xFFA500,
              ("issue_comment", "created"): 0x5865F2,
              ("discussion", "created"): 0x3D94F4,
              ("discussion", "answered"): 0x2ECC71,
              ("discussion", "locked"): 0xFF4444,
              ("discussion_comment", "created"): 0x5865F2,
          }
          color = colors.get((event_type, action), 0xCCCCCC)

          payload = {
              "username": "mailroom-ops-bot",
              "avatar_url": "https://i.imgur.com/CsZ3mRy.png",
              "embeds": [
                  {
                      "title": embed_title[:256],
                      "description": desc[:4096],
                      "color": color,
                      "url": url or None,
                  }
              ],
          }
          if not payload["embeds"][0]["url"]:
              del payload["embeds"][0]["url"]

          data = json.dumps(payload).encode("utf-8")
          # Cloudflare blocks Python-urllib default UA (error 1010); DiscordBot UA is allowed.
          req = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/LLM-Mailroom-Services/mailroom-issues, 1.0)",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Discord webhook OK status={resp.status}")
          except urllib.error.HTTPError as e:
              err_body = e.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Discord webhook failed status={e.code} body={err_body}") from None
          PY
