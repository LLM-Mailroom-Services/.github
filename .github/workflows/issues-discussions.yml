name: Issue & Discussion Notifications to Discord

on:
  workflow_call:
    inputs:
      event_type:
        required: true
        type: string
      title:
        required: true
        type: string
      body:
        required: false
        type: string
      actor:
        required: true
        type: string
      url:
        required: true
        type: string
      action:
        required: false
        type: string
        default: 'opened'
      discussion_category:
        required: false
        type: string

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Discord
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_ISSUE_WEBHOOK }}
          username: mailroom-ops-bot
          avatar-url: https://i.imgur.com/CsZ3mRy.png
          embed-title: >
            ${{ inputs.event_type == 'issue' && inputs.action == 'closed' && '✅ Closed Issue' || inputs.event_type == 'issue' && inputs.action == 'reopened' && '🔄 Reopened Issue' || inputs.event_type == 'discussion' && inputs.action == 'archived' && '📦 Archived Discussion' || inputs.event_type == 'discussion' && inputs.action == 'unarchived' && '📤 Unarchived Discussion' || inputs.event_type == 'discussion' && inputs.action == 'pinned' && '📌 Pinned Discussion' || inputs.event_type == 'discussion' && inputs.action == 'unpinned' && '📌 Unpinned Discussion' || inputs.event_type == 'discussion' && inputs.action == 'locked' && '🔒 Locked Discussion' || inputs.event_type == 'discussion' && inputs.action == 'unlocked' && '🔓 Unlocked Discussion' || inputs.event_type == 'discussion' && inputs.action == 'transferred' && '➡️ Transferred Discussion' || inputs.event_type == 'discussion' && inputs.action == 'category_changed' && '🏷️ Category Changed Discussion' || inputs.event_type == 'discussion' && inputs.action == 'updated' && '✏️ Updated Discussion' || inputs.event_type == 'discussion' && '💬 New Discussion' || inputs.event_type == 'issue_comment' && inputs.action == 'created' && '💬 New Issue Comment' || inputs.event_type == 'issue_comment' && '✏️ Edited Issue Comment' || '🔔 Notification' }}
          embed-description: |
            **${{ inputs.title }}**

            ${{ inputs.body != '' && inputs.body || 'No additional details.' }}

            👤 By: ${{ inputs.actor }}
            🔗 [View on GitHub](${{ inputs.url }})
            ${{ inputs.discussion_category != '' && format('🏷️ Category: {0}', inputs.discussion_category) || '' }}
          embed-color: >
            ${{ inputs.event_type == 'issue' && inputs.action == 'closed' && '100278E9' || inputs.event_type == 'issue' && inputs.action == 'reopened' && 'FFA500' || inputs.event_type == 'discussion' && inputs.action == 'archived' && '6B7B8D' || inputs.event_type == 'discussion' && inputs.action == 'pinned' && 'FFD700' || inputs.event_type == 'discussion' && inputs.action == 'locked' && 'FF4444' || inputs.event_type == 'discussion' && inputs.action == 'unlocked' && '44BB44' || inputs.event_type == 'discussion' && inputs.action == 'transferred' && 'AA44FF' || inputs.event_type == 'discussion' && inputs.action == 'category_changed' && 'FF88CC' || inputs.event_type == 'discussion' && '3D94F4' || inputs.event_type == 'issue' && '23AF92' || 'CCCCCC' }}
